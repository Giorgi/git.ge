# Weekly: full discovery of developers by location, then a refresh that
# fetches only the repos discovery just added.
#
# A full run takes about 35 minutes with a personal token, and several hours
# with the default GITHUB_TOKEN (~1,000 requests/hour). Discovery saves a
# checkpoint to data/bot/state/discovery.json about once a minute. If a run
# stops early (step timeout, cancellation, error), the checkpoint is still
# committed, and the daily resume check below continues it the next day.

name: Discover

on:
  schedule:
    # Mondays 03:23 UTC: start a new weekly discovery.
    - cron: "23 3 * * 1"
    # Daily 04:41 UTC: resume an unfinished discovery, if a checkpoint exists.
    - cron: "41 4 * * *"
    # GitHub may start scheduled runs late; nothing depends on exact timing.
  # A merged account PR (or any edit that adds logins to the include list): fetch
  # just the added accounts and deploy, so they're on the site within minutes.
  push:
    branches: [main]
    paths: ["data/manual/developers.json"]
  workflow_dispatch:
    inputs:
      restart:
        description: Discard an unfinished run's checkpoint and start over
        type: boolean
        default: false
      login:
        description: "Only these accounts (comma-separated; on the include list or already listed), then deploy"
        type: string
        default: ""

# Shared with nightly.yml: only one workflow writes the `data` branch at a time.
concurrency:
  group: data-branch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write   # push to the `data` branch
      actions: write    # start deploy.yml after a --login run
    env:
      GH_TOKEN: ${{ secrets.GITGE_TOKEN || github.token }}
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7

      - name: Check out bot data
        id: data
        uses: actions/checkout@v7
        with:
          ref: data
          path: data/bot

      - name: Decide whether to run
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          BEFORE: ${{ github.event.before }}
          INPUT_LOGIN: ${{ inputs.login }}
        run: |
          if [ "$EVENT" = "push" ]; then
            # Logins in the include list now that weren't before this push.
            git fetch -q --depth=1 origin "$BEFORE" 2>/dev/null || true
            added=$(python3 - <<'PY'
          import json, os, subprocess
          def include(ref):
              try:
                  return json.loads(subprocess.check_output(["git", "show", f"{ref}:data/manual/developers.json"]))["include"]
              except Exception:
                  return []
          before = {login.lower() for login in include(os.environ["BEFORE"])}
          print(",".join(login for login in include("HEAD") if login.lower() not in before))
          PY
            )
            if [ -z "$added" ]; then
              echo "No logins added to the include list."
              echo "run=false" >> "$GITHUB_OUTPUT"
            else
              echo "Added to the include list: $added"
              echo "run=true" >> "$GITHUB_OUTPUT"
              echo "login=$added" >> "$GITHUB_OUTPUT"
            fi
          elif [ "$EVENT" = "schedule" ] && [ "$SCHEDULE" = "41 4 * * *" ] && [ ! -f data/bot/state/discovery.json ]; then
            echo "No unfinished discovery to resume."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "login=$INPUT_LOGIN" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-dotnet@v6
        if: steps.gate.outputs.run == 'true'
        with:
          dotnet-version: 10.0.x

      - name: Discover developers and repos
        if: steps.gate.outputs.run == 'true'
        # A step timeout (not only the job timeout) so the commit step below
        # still gets to run and save the checkpoint.
        timeout-minutes: 320
        env:
          RESTART: ${{ inputs.restart && '--restart' || '' }}
          LOGIN: ${{ steps.gate.outputs.login }}
        run: |
          if [ -n "$LOGIN" ]; then
            dotnet run gitge.cs -- discover --login "$LOGIN"
          else
            dotnet run gitge.cs -- discover $RESTART
          fi

      - name: Refresh newly discovered repos
        if: steps.gate.outputs.run == 'true'
        # Repos already refreshed today are skipped, so this only fetches new ones.
        timeout-minutes: 60
        run: dotnet run gitge.cs -- refresh

      - name: Fetch contributors and followers for developer pages
        if: steps.gate.outputs.run == 'true'
        # Conditional requests: unchanged lists cost nothing. Resumable: entries
        # fetched today are skipped, so a rerun continues where this one stopped.
        timeout-minutes: 90
        run: dotnet run gitge.cs -- social

      - name: Commit bot data
        # always(): an unfinished run's checkpoint must be saved for the resume.
        if: always() && steps.data.outcome == 'success' && steps.gate.outputs.run == 'true'
        working-directory: data/bot
        env:
          LOGIN: ${{ steps.gate.outputs.login }}
        run: |
          if [ -n "$LOGIN" ]; then
            message="Discovery of $LOGIN $(date -u +%F)"
          elif [ -f state/discovery.json ]; then
            message="Discovery checkpoint $(date -u +%F)"
          else
            message="Weekly discovery $(date -u +%F)"
          fi
          bash ../../.github/scripts/commit-data.sh "$message"

      # A --login run is for getting a just-added account onto the site now rather
      # than after the nightly. A dispatch made with GITHUB_TOKEN does start a run.
      - name: Deploy
        if: success() && steps.gate.outputs.login != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
