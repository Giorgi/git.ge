# Deploy the built site. This is the only file that knows about the host.
#
# Currently Cloudflare Workers static assets (a Worker with no script, only
# the files in _site/), deployed with Wrangler. Not Cloudflare Pages, which
# Cloudflare now calls legacy. The Worker is created on first deploy; attach
# the custom domain in the dashboard (Worker > Settings > Domains & Routes).
#
# To switch to Netlify, replace the "Write Wrangler config" and "Deploy" steps
# with the Netlify CLI, e.g.
#   npx netlify-cli deploy --prod --dir=_site --site=$NETLIFY_SITE_ID
# with NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID secrets. Netlify reads the same
# _headers file format, so nothing else changes.
#
# Called by nightly.yml with an already built `_site` artifact. Run manually
# (workflow_dispatch) to rebuild from the current data and deploy.

name: Deploy

on:
  workflow_call:
    inputs:
      artifact:
        description: Name of the uploaded artifact that contains _site
        type: string
        required: true
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Only when no built site was passed in (a manual run of this workflow).
    # Not github.event_name: in a called workflow that is the caller's event, so
    # a manually triggered nightly would build the site twice.
    if: ${{ !inputs.artifact }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          ref: data
          path: data/bot

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Prepare site data
        run: dotnet run gitge.cs -- prepare

      - name: Build site
        run: dotnet run --project site

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: _site
          include-hidden-files: true
          retention-days: 7

  deploy:
    needs: build
    # Runs after a manual build, or directly when called (build is skipped then).
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check Cloudflare settings
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; skipping deploy."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v8
        if: steps.cf.outputs.configured == 'true'
        with:
          name: ${{ inputs.artifact || 'site' }}
          path: _site

      - name: Write Wrangler config
        # Kept here rather than in a repo file, so this workflow stays the only
        # place that knows about the host. _headers in _site is applied natively;
        # unknown URLs get _site/404.html with a 404 status.
        if: steps.cf.outputs.configured == 'true'
        env:
          WORKER_NAME: ${{ vars.CF_WORKER_NAME || 'git-ge' }}
        run: |
          cat > wrangler.jsonc <<EOF
          {
            "name": "$WORKER_NAME",
            "compatibility_date": "2026-09-25",
            "assets": {
              "directory": "./_site",
              "not_found_handling": "404-page",
              "html_handling": "auto-trailing-slash"
            }
          }
          EOF
          cat wrangler.jsonc

      - name: Deploy to Cloudflare Workers
        if: steps.cf.outputs.configured == 'true'
        env:
          WRANGLER_SEND_METRICS: "false"   # no usage telemetry from our deploys
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
