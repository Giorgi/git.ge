<!doctype html>
<!-- Source of the share image (og:image), 1200x630, served as /og.png.
     To regenerate after changing it, render with a headless browser, e.g.:
       msedge --headless=new --window-size=1200,630 --allow-file-access-from-files
              --screenshot=site/wwwroot/og.png file:///<repo>/site/og/og.html -->
<html lang="ka">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Noto Sans Georgian";
    src: url("../wwwroot/assets/fonts/noto-sans-georgian.woff2") format("woff2");
    font-weight: 400 700;
    unicode-range: U+10A0-10FF, U+1C90-1CBF, U+2D00-2D2F;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #fdfdfc; color: #1b1b1a;
    font-family: "Noto Sans Georgian", "Segoe UI", system-ui, sans-serif;
    display: flex; align-items: center; padding: 0 96px;
    border-bottom: 14px solid #b3261e;
  }
  .logo { font-size: 180px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; margin-bottom: 44px; }
  .logo span { color: #b3261e; }
  .ka { font-size: 44px; font-weight: 600; line-height: 1.3; max-width: 1000px; margin-bottom: 18px; }
  .en { font-size: 34px; color: #62625f; line-height: 1.35; }
</style>
</head>
<body>
  <div>
    <div class="logo">git<span>.ge</span></div>
    <div class="ka">საქართველოს დეველოპერების ღია კოდის პროექტები</div>
    <div class="en">Open-source projects by developers in Georgia</div>
  </div>
</body>
</html>
